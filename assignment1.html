<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Assignment 1</title>
    <style>
        .background{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .name {
            position: absolute;
            font-family: Arial, sans-serif;
            color: white;
            top: 30%;
            left: 30%;
            z-index: 1;
            margin: 4px 0;
        }
        .menu {
            position: absolute;
            top: 20%;
            right: 10%;
            z-index: 1;
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;

        }
        .menu p {
            display: block;
            margin: 4px 0;
            color: white;
            font-family: Arial, sans-serif;
        }
        a{
            color: white;
            text-decoration: none;
        }
        a:visited{
            color: white;
        }
    </style>
</head>
<body>
    <video class="background" autoplay muted loop playsinline>
        <source src="./images/background.mp4" type="video/mp4">
    </video>
    <h2 class="name">Mason Andrade</h2>
    <div class="menu">
        <p><i class="fa-solid fa-user"></i><a href="index.html"> About me </a></p>
        <p><i class="fa-solid fa-file-lines"></i> Resume</p>
        <p><i class="fa-solid fa-gamepad"></i> Hobby</p>
        <p><i class="fa-solid fa-briefcase"></i> Work</p>
        <p><i class="fa-solid fa-project-diagram"></i><a href="project.html"> Projects</a></p>

    </div>
</body>
</html>
